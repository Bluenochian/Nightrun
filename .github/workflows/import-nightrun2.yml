name: Import released Nightrun 2.0 source for 2.2 maintenance

on:
  push:
    branches: [main]
    paths: [.github/workflows/import-nightrun2.yml]

permissions:
  contents: write

jobs:
  import-released-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch unchanged Nightrun 2.0 archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/nightrun-released"
          gh release download release2 --repo Bluenochian/Nightrun \
            --pattern 'nightrun_2_0.zip' --dir "$RUNNER_TEMP/nightrun-released"
      - name: Preserve actual released files in nightrun2.2
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import shutil
          import os
          import re

          source = Path(os.environ['RUNNER_TEMP']) / 'nightrun-released' / 'nightrun_2_0.zip'
          out = Path('nightrun2.2')
          with ZipFile(source) as archive:
              names = [item.filename for item in archive.infolist() if not item.is_dir()]
              if len(names) < 8:
                  raise RuntimeError('Release archive did not include expected program files')
              root = os.path.commonpath(names)
              root = root if root.endswith('/') else root.rsplit('/', 1)[0] + '/' if '/' in root else ''
              extracted = 0
              for info in archive.infolist():
                  if info.is_dir() or info.file_size > 20_000_000:
                      continue
                  path = info.filename.replace('\\', '/')
                  if path.startswith('/') or '..' in Path(path).parts:
                      raise RuntimeError('Unsafe archive path')
                  relative = path[len(root):] if root and path.startswith(root) else path
                  if not relative or relative.startswith('.') or any(p in ('__pycache__','venv','.git') for p in Path(relative).parts):
                      continue
                  target = out / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with archive.open(info) as inp, target.open('wb') as dest:
                      shutil.copyfileobj(inp, dest)
                  extracted += 1
          python_files = list(out.rglob('*.py'))
          print(f'Imported {extracted} released files, {len(python_files)} Python sources')
          print('Top-level entries:', sorted(p.name for p in out.iterdir()))
          if not any(p.name == 'nightrun.py' for p in python_files):
              raise RuntimeError('Missing released Nightrun runner')
          PY
      - name: Commit sources without modifying old releases
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nightrun2.2
          if ! git diff --cached --quiet; then
            git commit -m 'Import released 2.0 sources for Nightrun 2.2'
            git push origin HEAD:main
          fi

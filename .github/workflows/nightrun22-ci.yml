name: Nightrun 2.2 checks

on:
  push:
    branches: [main]
    paths:
      - 'nightrun2.2/**'
      - '.github/workflows/nightrun22-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regressions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime dependencies for tests
        run: python -m pip install requests Pillow
      - name: Syntax and configuration
        run: |
          python -m compileall -q nightrun2.2/nightrun_2.0/modules
          python -m json.tool nightrun2.2/nightrun_2.0/config.json >/dev/null
      - name: Offline regression tests
        run: python -m unittest discover -s nightrun2.2/tests -p 'test_*.py' -v
